<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoForm - Evaluation Auto-fill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="logo-text">
          <span class="app-title">AutoForm</span>
          <span class="app-subtitle"><span class="feu-green">FEU</span> <span class="feu-gold">Tech</span> Evaluations</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-indicator">
          <span class="pulse-dot"></span>
          <span class="status-text">Ready</span>
        </div>
      </div>
    </header>

    <div class="segmented-control">
      <div class="segment-track"></div>
      <button id="ratingModeBtn" class="segment-btn active" data-mode="rating">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>Ratings</span>
      </button>
      <button id="frequencyModeBtn" class="segment-btn" data-mode="frequency">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Frequency</span>
      </button>
    </div>

    <main class="modes-container">
      <div id="ratingMode" class="mode-panel active">
        <div class="action-grid">
          <button id="fillHighest" class="action-card success">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </div>
            <div class="card-content">
              <span class="card-title">Fill Highest</span>
              <span class="card-subtitle">Rate 5/5 — Strongly Agree</span>
            </div>
            <div class="card-shimmer"></div>
          </button>

          <button id="fillLowest" class="action-card danger">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="card-content">
              <span class="card-title">Fill Lowest</span>
              <span class="card-subtitle">Rate 1/5 — Strongly Disagree</span>
            </div>
            <div class="card-shimmer"></div>
          </button>
        </div>

        <div class="custom-card">
          <div class="custom-header">
            <span class="custom-title">Custom Rating</span>
            <span class="custom-hint">Slide to choose</span>
          </div>
          <div class="custom-body">
            <div class="slider-container">
              <input type="range" id="ratingSlider" min="1" max="5" value="3" class="modern-slider" aria-label="Custom rating">
              <div class="slider-track">
                <div class="slider-fill"></div>
                <div class="slider-markers">
                  <span>1</span>
                  <span>2</span>
                  <span>3</span>
                  <span>4</span>
                  <span>5</span>
                </div>
              </div>
              <div id="sliderValue" class="slider-badge">3</div>
            </div>
            <button id="fillCustom" class="btn-action">
              <span id="fillText" class="btn-text">Apply Rating</span>
              <svg id="fillIcon" class="btn-icon-check" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div id="frequencyMode" class="mode-panel">
        <div class="info-banner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>For "How often do you visit" questions</span>
        </div>

        <div class="list-group">
          <button id="fillWeekly" class="list-item">
            <span class="list-text">Once a week</span>
            <kbd class="shortcut-badge">1</kbd>
          </button>
          <button id="fillMonthly" class="list-item">
            <span class="list-text">Once a month</span>
            <kbd class="shortcut-badge">2</kbd>
          </button>
          <button id="fillTerm" class="list-item">
            <span class="list-text">Once a term</span>
            <kbd class="shortcut-badge">3</kbd>
          </button>
          <button id="fillYear" class="list-item">
            <span class="list-text">Once a year</span>
            <kbd class="shortcut-badge">4</kbd>
          </button>
          <button id="fillOthers" class="list-item">
            <span class="list-text">Others</span>
            <kbd class="shortcut-badge">5</kbd>
          </button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <span class="footer-text">Combobulated by <a href="https://github.com/juuli6nn" target="_blank" rel="noopener noreferrer" class="footer-link"><strong>juuli6nn</strong></a></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
